name: Build Ornerede

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtbase

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -czf ornerede-linux.tar.gz -C build ornerede

      - name: Package Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path build/Release/ornerede.exe -DestinationPath ornerede-windows.zip

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p package
          cp build/ornerede package/
          tar -czf ornerede-macos.tar.gz -C package .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ornerede-${{ matrix.name }}
          path: ornerede-*
